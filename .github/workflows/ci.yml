name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install` (not `npm ci`): npm 10 misreads npm 11's cross-platform
      # optional-dep (esbuild) entries under `npm ci`, and pinning npm 11 makes it
      # block the native modules' (better-sqlite3/sharp) install scripts. Plain
      # install resolves the platform deps and runs the build scripts.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
