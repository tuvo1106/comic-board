name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm install` (not `npm ci`): npm 10 misreads npm 11's cross-platform
      # optional-dep (esbuild) entries under `npm ci`, and pinning npm 11 makes it
      # block the native modules' (better-sqlite3/sharp) install scripts. Plain
      # install resolves the platform deps and runs the build scripts.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # The react-hooks rules here catch real bugs that tsc can't (refs read
      # during render, setState cascades in effects). Two such errors sat on main
      # unnoticed precisely because nothing ran this.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      # Drives the real app in headless Chrome against an isolated DB/port/build
      # dir (all torn down by the script).
      - name: Integration tests
        run: npm run test:integration
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
